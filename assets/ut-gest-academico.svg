    <text x="22" y="36" font-family="Arial, sans-serif" font-size="12" fill="#cdb8d8">Avance por componente</text>
    <rect x="22" y="60" width="255" height="10" rx="5" fill="#2a2630"/>
    <rect x="22" y="60" width="216" height="10" rx="5" fill="#8b2cff"/>
    <rect x="22" y="92" width="255" height="10" rx="5" fill="#2a2630"/>
    <rect x="22" y="92" width="198" height="10" rx="5" fill="#a542ff"/>
    <rect x="22" y="124" width="255" height="10" rx="5" fill="#2a2630"/>
    <rect x="22" y="124" width="187" height="10" rx="5" fill="#ff2c9c"/>
    <text x="22" y="154" font-family="Arial, sans-serif" font-size="10" fill="#cdb8d8">C1 · C2 · C3</text>
  </g>

  <text x="110" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Registro</text>
  <text x="235" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Evidencias</text>
  <text x="380" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Indicadores</text>
  <text x="540" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Gestión</text>
  <text x="690" y="565" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Seguimiento</text>
  <line x1="110" y1="585" x2="1050" y2="585" stroke="#2c2830"/>
  <text x="110" y="614" font-family="Arial, sans-serif" font-size="10" fill="#8e8294">UT-GEST · Sistema demostrativo de gestión y seguimiento académico</text>
