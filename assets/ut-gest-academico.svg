    <circle cx="238" cy="82" r="45" fill="none" stroke="#ff2c9c" stroke-width="12" stroke-linecap="round" stroke-dasharray="210 283" transform="rotate(-90 238 82)"/>
    <text x="238" y="87" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">86%</text>
    <text x="22" y="148" font-family="Arial, sans-serif" font-size="10" fill="#cdb8d8">Validadas por el sistema</text>
