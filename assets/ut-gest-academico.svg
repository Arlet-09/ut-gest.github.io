    <text x="22" y="82" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">78%</text>
    <rect x="22" y="110" width="250" height="12" rx="6" fill="#2a2630"/>
    <rect x="22" y="110" width="195" height="12" rx="6" fill="url(#purple)"/>
    <text x="22" y="148" font-family="Arial, sans-serif" font-size="10" fill="#56e6b0">+6% respecto al periodo anterior</text>
  </g>

  <g transform="translate(430 315)">
    <rect width="300" height="170" rx="22" fill="#15151c" stroke="#8b2cff" stroke-opacity="0.35"/>
    <text x="22" y="36" font-family="Arial, sans-serif" font-size="12" fill="#cdb8d8">Evidencias registradas</text>
    <text x="22" y="82" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#fff">48</text>
