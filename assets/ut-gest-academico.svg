<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070a"/>
      <stop offset="0.55" stop-color="#16081f"/>
      <stop offset="1" stop-color="#2a0b3b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b2cff"/>
      <stop offset="1" stop-color="#d51cff"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="1050" cy="100" r="220" fill="#8b2cff" opacity="0.12"/>
  <circle cx="180" cy="600" r="220" fill="#8b2cff" opacity="0.09"/>

  <rect x="70" y="60" width="1060" height="580" rx="34" fill="#0c0c11" stroke="#8b2cff" stroke-opacity="0.35" filter="url(#shadow)"/>
  <rect x="70" y="60" width="1060" height="82" rx="34" fill="#111116"/>
  <rect x="70" y="108" width="1060" height="34" fill="#111116"/>

  <rect x="100" y="83" width="42" height="42" rx="11" fill="url(#purple)"/>
  <text x="121" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">UT</text>
  <text x="158" y="101" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#fff">UT-GEST</text>
  <text x="158" y="123" font-family="Arial, sans-serif" font-size="10" fill="#bfaeca">Gestión y Seguimiento Académico</text>

  <rect x="400" y="86" width="85" height="34" rx="10" fill="#fff"/>
  <text x="442" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#140b18">Inicio</text>
  <text x="530" y="108" font-family="Arial, sans-serif" font-size="11" fill="#cdb8d8">Datos</text>
  <text x="590" y="108" font-family="Arial, sans-serif" font-size="11" fill="#cdb8d8">Evidencias</text>
  <text x="680" y="108" font-family="Arial, sans-serif" font-size="11" fill="#cdb8d8">Indicadores</text>
  <text x="770" y="108" font-family="Arial, sans-serif" font-size="11" fill="#cdb8d8">Gestión</text>
  <text x="840" y="108" font-family="Arial, sans-serif" font-size="11" fill="#cdb8d8">Recursos</text>

  <text x="110" y="190" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" font-weight="800" fill="#ff5fbe">PANEL ADMINISTRATIVO</text>
  <text x="110" y="235" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#fff">Gestión y seguimiento académico</text>
  <text x="110" y="270" font-family="Arial, sans-serif" font-size="16" fill="#cdb8d8">Indicadores, evidencias y avances centralizados en una sola plataforma.</text>

  <g transform="translate(110 315)">
    <rect width="300" height="170" rx="22" fill="#15151c" stroke="#8b2cff" stroke-opacity="0.35"/>
